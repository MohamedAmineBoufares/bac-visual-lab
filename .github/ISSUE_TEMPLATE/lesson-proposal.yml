name: Proposition de leçon · Lesson proposal
description: Proposez ou améliorez une leçon. Pas besoin de savoir programmer.
title: "Leçon : "
labels: ["lesson"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ce formulaire suit [le modèle de fiche](https://github.com/MohamedAmineBoufares/bac-visual-lab/blob/main/content/TEMPLATE.md).
        Voir [l'exemple du dipôle RC](https://github.com/MohamedAmineBoufares/bac-visual-lab/blob/main/content/lessons/rc-charging.md).
  - type: dropdown
    id: chapter
    attributes:
      label: Chapitre
      description: Les sections du Bac et l’identifiant sont déjà fixés pour chaque chapitre (fichier content/lessons/<identifiant>.md).
      options:
        - "Charge d’un condensateur (rc-charging)"
        - "Dipôle RL (rl-circuit)"
        - "Oscillations électriques libres (rlc-free)"
        - "Oscillations électriques forcées (rlc-forced)"
        - "Filtres électriques (filters)"
        - "Oscillations mécaniques libres (mech-free)"
        - "Oscillations mécaniques forcées (mech-forced)"
        - "Ondes mécaniques progressives (mechanical-waves)"
        - "Diffraction de la lumière (light-diffraction)"
        - "Spectre atomique (atomic-spectrum)"
        - "Réactions nucléaires (nuclear-reactions)"
        - "Cinétique chimique (reaction-kinetics)"
        - "Équilibre chimique (chemical-equilibrium)"
        - "Loi d’action de masse (mass-action)"
        - "pH des solutions aqueuses (ph)"
        - "Dosage acide-base (acid-base-titration)"
        - "Piles électrochimiques (electrochemical-cells)"
        - "Électrolyse (electrolysis)"
        - "Estérification et hydrolyse (esterification)"
        - "Les amides (amides)"
        - "Limites et continuité (limits-continuity)"
        - "Dérivabilité (differentiability)"
        - "Suites réelles (sequences)"
        - "Fonctions réciproques (inverse-functions)"
        - "Primitives (antiderivatives)"
        - "Calcul intégral (integration)"
        - "Fonction logarithme népérien (logarithm)"
        - "Fonction exponentielle (exponential)"
        - "Équations différentielles (differential-equations)"
        - "Nombres complexes (complex-numbers)"
        - "Arithmétique (arithmetic)"
        - "Géométrie dans l’espace (solid-geometry)"
        - "Isométries et déplacements (isometries)"
        - "Similitudes (similarities)"
        - "Coniques (conics)"
        - "Probabilités (probability)"
        - "Séries statistiques à deux variables (bivariate-statistics)"
        - "Autre chapitre (nommez-le dans l’objectif)"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: L'idée principale que l'élève doit retenir.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Ce que l'élève règle
      description: Pour chaque curseur, symbole, grandeur, unité, min, max, valeur initiale.
      placeholder: "L, inductance, mH, 10, 500, 100"
    validations:
      required: true
  - type: textarea
    id: view
    attributes:
      label: Ce que l'élève voit
  - type: textarea
    id: view3d
    attributes:
      label: Vue 3D (facultatif)
      description: >-
        Le montage en 3D que l'élève peut faire tourner. Pour chaque objet : sa forme, ce qui le fait changer
        (un curseur ou le temps) et ce qu'il montre. Exemple : « Condensateur : un réservoir entre les armatures
        qui se remplit avec u_C ».
  - type: textarea
    id: formulas
    attributes:
      label: Formules
      description: En TeX si possible.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Valeurs de référence
      description: Des résultats exacts et vérifiables (ex. « à t = τ, i = 63 % de I₀ »).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes commentées
  - type: textarea
    id: mistakes
    attributes:
      label: Erreurs fréquentes des élèves
  - type: textarea
    id: quiz
    attributes:
      label: Quiz
      description: 3 à 5 questions avec la bonne réponse et l'explication.
  - type: input
    id: author
    attributes:
      label: Nom à afficher comme auteur
  - type: checkboxes
    id: consent
    attributes:
      label: Droits
      options:
        - label: Ce contenu est original (rien de copié des manuels du CNP) et peut être publié sous licence MIT.
          required: true
