<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Title, description, canonical and hreflang tags are added per page (scripts/prerender.ts, src/main.tsx). -->
    <script>
      // Saved display settings before the first paint, so a prerendered page never flashes the light theme.
      // Mirrors the defaults in src/settings/settings.tsx.
      try {
        const s = JSON.parse(localStorage.getItem("bvl.settings") || "{}");
        const d = document.documentElement.dataset;
        d.theme = s.theme || "light";
        d.cb = s.colorBlind ? "on" : "off";
        d.font = s.font || "default";
        d.size = s.size || "m";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless, no personal data. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "19b8859430324716ae4da52817f1ca7f"}'
    ></script>
  </body>
</html>
